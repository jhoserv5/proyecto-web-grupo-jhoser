<body>


      <div  class="name"><h2>Contáctanos</h2></div>
    <section id=" contacto" class="conta">

      
        

        <div class="div">   

            <form action="" class="form">

            <label class="te"  for="nombre"><strong>Nombre Completo:</strong></label>
                <input type="text" id="nombre" class="barra" placeholder="Ingresa tu nombre" required>

            <label class="te" for="correo"><strong>Correo Electrónico:</strong></label>
                <input type="email" id="correo" name="correo" class="barra" placeholder="ejemplo@sena.edu.co" required>

            <label class="te" for="Mensaje"><strong>Mensaje o Requerimineto:</strong></label>
                <textarea id="mensaje" class="barra" name="mensaje" rows="3" placeholder="Escribe tu mensaje aqui..."></textarea>

            <button type="submit" class="btn"><strong>Enviar Mensaje </strong></button>

            </form>

        </div>

    </section>
